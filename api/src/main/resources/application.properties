server.port=8080
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.xome.auction=DEBUG

# The audit trail is its own logger so it can be routed to its own file and
# retained on its own schedule. A disputed sale can be reconstructed from these
# lines alone: grep AUCTION_AUDIT, or grep a single requestId across them.
logging.level.AUCTION_AUDIT=INFO
